services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetspace
      POSTGRES_PASSWORD: meetspace_dev_password
      POSTGRES_DB: meetspace
    ports:
      - "5432:5432"
    volumes:
      - meetspace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetspace -d meetspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meetspace_pg_data: